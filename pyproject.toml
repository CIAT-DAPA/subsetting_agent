[project]
name = "subsetting-agent"
version = "0.1.0"
description = "AI agent that builds subsets of genebank accessions from passport data, traits, scientific documents and climate indicators (Genesys PGR + Subsetting API)."
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [{ name = "CIAT - Alliance Bioversity & CIAT" }]
dependencies = [
    "litellm>=1.50",
    "mcp>=1.2",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pymupdf4llm>=0.0.17",
    "gradio>=5.0",
    "python-dotenv>=1.0",
    "pandas>=2.3.3",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Packages that make up the application. Each one is importable after `uv sync`.
packages = [
    "accession_files",
    "storage",
    "subsetting_sdk",
    "genesys_sdk",
    "document_processing",
    "tools",
    "prompts",
    "reporting",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"
