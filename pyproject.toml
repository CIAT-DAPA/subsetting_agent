[project]
name = "subsetting-agent"
version = "0.1.0"
description = "AI agent that helps users build subsets of germplasm accessions combining passport, trait, climate and research data."
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [{ name = "CIAT - Alliance Bioversity & CIAT" }]
dependencies = [
    "gradio>=5.0",
    "httpx>=0.27",
    "litellm>=1.50",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
# The project is an application, not a distributable library: no build step required.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
